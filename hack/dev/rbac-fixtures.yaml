# Planted RBAC misconfigurations for Kaaval e2e verification.
# Expected findings per rule:
#   1. wide-open           → wildcard_permissions (+ cluster_admin_binding via default SA)
#   2. escalator           → privilege_escalation_verbs
#   3. node-proxier        → node_proxy_access
#   4. token-minter        → token_creation
#   5. csr-approver        → csr_approval
#   6. webhook-writer      → webhook_config_access
#   7. pv-creator          → pv_creation
#   8. deployer            → workload_creation
#   9. secret-reader (ns)  → broad_secrets_access (namespaced Role)
#  10. sneaky-masters      → cluster_admin_binding (user binding to system:masters)
#  11. safe-viewer         → must produce ZERO findings
#  12. cross-ns-reader     → segmentation_violation (namespaced SA bound cluster-wide)
#  13. default SA (automount unset)        → token_automount (MEDIUM)
#  14. token-happy SA (automount: true)    → token_automount (LOW)
#  15. locked-down SA (automount: false)   → must produce ZERO automount findings
#  16. override-pod (pod true over SA false) → token_automount (MEDIUM)
#  17. quiet-pod (pod automount: false)    → must produce ZERO automount findings
#  18. override-deploy (template true over SA false) → token_automount (MEDIUM)
#  19. combo-takeover SA   → per-role scan reports no escalation path for the
#                            subject; evaluate_combo_findings reports
#                            combo_role_escalation (issue #47 / #84 — Effective
#                            Access Graph)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wide-open
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wide-open-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wide-open
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: escalator
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["escalate", "bind", "impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: escalator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: escalator
subjects:
  - kind: ServiceAccount
    name: ci-runner
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-proxier
rules:
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-proxier-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-proxier
subjects:
  - kind: ServiceAccount
    name: debug-tool
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: token-minter
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: token-minter-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: token-minter
subjects:
  - kind: ServiceAccount
    name: token-svc
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csr-approver
rules:
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests/approval"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: csr-approver-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: csr-approver
subjects:
  - kind: ServiceAccount
    name: cert-bot
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webhook-writer
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webhook-writer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: webhook-writer
subjects:
  - kind: ServiceAccount
    name: hook-manager
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pv-creator
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pv-creator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pv-creator
subjects:
  - kind: ServiceAccount
    name: storage-svc
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployer
subjects:
  - kind: ServiceAccount
    name: deploy-bot
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-reader-binding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
subjects:
  - kind: ServiceAccount
    name: app-svc
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sneaky-masters
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: system:masters
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: safe-viewer
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: safe-viewer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: safe-viewer
subjects:
  - kind: ServiceAccount
    name: viewer-svc
    namespace: default
---
# 12. cross-ns-reader  → segmentation_violation
# A namespaced ServiceAccount (monitoring/prometheus-sa) bound cluster-wide via
# a ClusterRoleBinding. Prometheus and similar agents legitimately need
# cluster-wide read access; this fixture exists so the live testbed confirms
# the rule fires. Teams should document such SAs as expected cluster-agent SAs
# (see docs/rbac-rules.md) or replace the ClusterRoleBinding with per-namespace
# RoleBindings when cluster-wide reach is not required.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cross-ns-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cross-ns-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cross-ns-reader
subjects:
  - kind: ServiceAccount
    name: prometheus-sa
    namespace: monitoring
---
# 13. default SA that never opts out — fires (MEDIUM: it's the default SA)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: fixture-ns
---
# 14. explicit true — fires (LOW)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: token-happy
  namespace: fixture-ns
automountServiceAccountToken: true
---
# 15. explicit false — the desired state, no finding
apiVersion: v1
kind: ServiceAccount
metadata:
  name: locked-down
  namespace: fixture-ns
automountServiceAccountToken: false
---
# 16. pod re-enables automount over an opted-out SA — fires (MEDIUM)
apiVersion: v1
kind: Pod
metadata:
  name: override-pod
  namespace: fixture-ns
spec:
  serviceAccountName: locked-down
  automountServiceAccountToken: true
  containers:
    - name: app
      image: registry.example.com/app:1.0
---
# 17. pod explicitly opts out — no finding
apiVersion: v1
kind: Pod
metadata:
  name: quiet-pod
  namespace: fixture-ns
spec:
  serviceAccountName: locked-down
  automountServiceAccountToken: false
  containers:
    - name: app
      image: registry.example.com/app:1.0
---
# 18. Deployment pod template re-enables automount over an opted-out SA — fires (MEDIUM)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: override-deploy
  namespace: fixture-ns
spec:
  replicas: 1
  selector:
    matchLabels: {app: override-deploy}
  template:
    metadata:
      labels: {app: override-deploy}
    spec:
      serviceAccountName: locked-down
      automountServiceAccountToken: true
      containers:
        - name: app
          image: registry.example.com/app:1.0
---
# 19. Combination-takeover fixture (issue #86)
#
# The trap: combo-takeover-sa is bound to two benign-looking ClusterRoles.
# Evaluated in isolation neither role triggers an alert that reveals the full
# danger — only when the Effective Access Graph aggregates the subject's grants
# does the escalation path become visible.
#
# Trap anatomy:
#   combo-role-writer   → grants "create" on roles/clusterroles (rbac group)
#                         Looks like a normal role-provisioning account.
#                         Per-role scan: no escalation finding — "create" on RBAC
#                         objects is not a standalone red flag in the current rule
#                         set. (The binding does raise segmentation_violation, as
#                         every ClusterRoleBinding over a namespaced SA does; that
#                         is about cluster-scope reach, not the takeover path.)
#
#   combo-escalate-gate → grants "escalate" on clusterroles (rbac group)
#                         Looks like a tightly-scoped escalation guard.
#                         Per-role scan: privilege_escalation_verbs (HIGH — the
#                         rule scores HIGH whenever the role is cluster-scoped;
#                         it is MEDIUM only for a namespaced Role).
#
# Neither per-role finding names the takeover path: the scanner flags the
# escalate verb and the cluster-scope reach, but nothing tells you this subject
# can mint a role and climb into it.
#
# Combined (evaluate_combo_findings):
#   The subject can *create* a role with arbitrary verbs, then *escalate* into
#   it without a privilege check — a full cluster takeover.
#   Finding: combo_role_escalation (CRITICAL).
#
# Verify:
#   kind create cluster --name kaaval-dev 2>/dev/null || true
#   kubectl apply -f hack/dev/rbac-fixtures.yaml
#   # Per-role scan reports privilege_escalation_verbs + segmentation_violation,
#   # but no combo_role_escalation for the subject.
#   # evaluate_combo_findings() already reports combo_role_escalation (CRITICAL)
#   # for combo-takeover-sa today — the predicates shipped in #105/#131/#145.
#   # What #84 adds is surfacing it through the per-role scan path.

# Role A — "role provisioner": create roles/clusterroles looks routine.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: combo-role-writer
  labels:
    kaaval.dev/fixture: combo-takeover
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "clusterroles"]
    verbs: ["create"]  # half 1: create arbitrary roles — harmless without escalate
---
# Role B — "escalation gate": escalate verb scoped to clusterroles looks limited.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: combo-escalate-gate
  labels:
    kaaval.dev/fixture: combo-takeover
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["escalate"]  # half 2: escalate into existing roles — dangerous with create
---
# The subject: bound to both halves, each binding looks unremarkable alone.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: combo-takeover-sa
  namespace: default
  labels:
    kaaval.dev/fixture: combo-takeover
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: combo-role-writer-binding
  labels:
    kaaval.dev/fixture: combo-takeover
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: combo-role-writer
subjects:
  - kind: ServiceAccount
    name: combo-takeover-sa
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: combo-escalate-gate-binding
  labels:
    kaaval.dev/fixture: combo-takeover
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: combo-escalate-gate
subjects:
  - kind: ServiceAccount
    name: combo-takeover-sa
    namespace: default
