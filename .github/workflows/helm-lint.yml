name: Helm Lint

on:
  push:
    branches: [main]
    paths:
      - 'deploy/helm/**'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/helm/**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/helm/kaaval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.14.4
      - name: Add bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami
      - name: Update dependencies
        run: helm dependency update
      - name: Lint chart
        run: helm lint .
      - name: Template chart (dry-run)
        run: helm template . --dry-run
